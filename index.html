<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>매출 대시보드</title>
<style>
:root { --bg: #f6f7f9; --fg: #1d2330; --muted: #626b7a; --panel: #fff; --line: #e2e5ea; --accent: #3b73d9; --bad: #c9372c; }
@media (prefers-color-scheme: dark) { :root { --bg: #12151b; --fg: #e8eaee; --muted: #9aa2b1; --panel: #1b1f27; --line: #2c323d; --accent: #6b9bff; --bad: #ff7b6e; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.box { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
p { margin: 0; font-size: 13px; color: var(--muted); }
input[type=password] { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
button { padding: 12px; font-size: 15px; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--bad); min-height: 1.2em; }
</style>
</head>
<body>
<div class="box">
  <h1>매출 대시보드</h1>
  <p>비밀번호를 입력하세요.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="비밀번호" autofocus>
  <label><input id="keep" type="checkbox"> 이 기기에서 비밀번호 기억</label>
  <button id="go" type="button">열기</button>
  <p class="err" id="err"></p>
</div>
